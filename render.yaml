databases:
  - name: neon-ai-db
    plan: free
    databaseName: neon_ai
    user: neon_ai
    ipAllowList: []

services:
  - type: web
    name: neon-ai-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL
        value: gemini-3.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: neon-ai-db
          property: connectionString
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_DIM
        value: "384"
      - key: CHROMA_DIR
        value: /tmp/chroma_data
